name: Build and Publish Frigate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Frigate upstream version'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frigate:stable
            ${{ inputs.version != '' && format('{0}/frigate:{1}', secrets.DOCKERHUB_USERNAME, inputs.version) || '' }}