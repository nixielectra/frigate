name: Check Frigate Upstream Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL https://api.github.com/repos/blakeblackshear/frigate/releases/latest | jq -er '.tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to retrieve upstream version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $VERSION"

      - name: Read previous release
        id: previous
        run: |
          if [ -f frigate-version.txt ]; then
            VERSION=$(cat frigate-version.txt)
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version tracker
        if: steps.upstream.outputs.version != steps.previous.outputs.version
        run: |
          echo "${{ steps.upstream.outputs.version }}" > frigate-version.txt

      - name: Commit version tracker
        if: steps.upstream.outputs.version != steps.previous.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frigate-version.txt
          git commit -m "Update Frigate upstream version to ${{ steps.upstream.outputs.version }}"
          git push

      - name: Trigger Docker build
        if: steps.upstream.outputs.version != steps.previous.outputs.version
        run: |
          gh workflow run build.yml \
            --ref main \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}